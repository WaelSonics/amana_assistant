<title>Amana Flag Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Desk sheet, short: four figures, three actions, the lines, the stocks that signal, then rules and dates side by side. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#15202b; --ink2:#4a5868; --ink3:#7a8693; --line:#d6dde4; --line2:#e6ebf0;
  --accent:#1f4e8c; --accent-bg:#e4ecf7;
  --good:#1d7a4c; --good-bg:#e2f2e9; --warn:#9a6200; --warn-bg:#f8eed9; --bad:#b42318; --bad-bg:#fbe5e3;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --panel:#161d25; --ink:#e5eaef; --ink2:#a9b4bf; --ink3:#7c8792; --line:#2a3440; --line2:#212a34;
  --accent:#86aee6; --accent-bg:#1b2a3d;
  --good:#5cc48f; --good-bg:#16291f; --warn:#e2aa4c; --warn-bg:#2d2414; --bad:#f17d72; --bad-bg:#331b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#161d25; --ink:#e5eaef; --ink2:#a9b4bf; --ink3:#7c8792; --line:#2a3440; --line2:#212a34;
  --accent:#86aee6; --accent-bg:#1b2a3d;
  --good:#5cc48f; --good-bg:#16291f; --warn:#e2aa4c; --warn-bg:#2d2414; --bad:#f17d72; --bad-bg:#331b19; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:1080px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(26px,4vw,34px);font-weight:700;letter-spacing:-.01em}
h2{font-size:14px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.eyebrow{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:6px 24px}
.asof{color:var(--ink2);font-size:13px}
.sec{display:grid;gap:10px;min-width:0;align-content:start}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.sec-h p{margin:0;color:var(--ink3);font-size:13px}
.box{border:1px solid var(--line);background:var(--panel)}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.cell{padding:14px 16px;border-left:1px solid var(--line2);display:grid;gap:3px;align-content:start;min-width:0}
.cell:first-child{border-left:0}
.cell .k{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.cell .v{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.cell .s{font-size:12.5px;color:var(--ink2)}
.meter{height:6px;background:var(--line2);position:relative;margin-top:3px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}
@media (max-width:640px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.cell:nth-child(3){border-left:0}
  .cell:nth-child(n+3){border-top:1px solid var(--line2)}}

.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 12px;padding:11px 16px;border-top:1px solid var(--line2)}
.steps li:first-child{border-top:0}
.steps .n{font-family:var(--mono);color:var(--ink3)}
.steps .t{font-weight:600}
.steps .x{grid-column:2/4;color:var(--ink2);font-size:14px}
.pill{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 8px;white-space:nowrap;align-self:start;border:1px solid transparent}
.p-act{background:var(--accent);color:var(--panel)} .p-hold{background:var(--line2);color:var(--ink2)}
.p-watch{background:var(--accent-bg);color:var(--accent)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-good{background:var(--good-bg);color:var(--good)}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);
  text-align:right;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-top:1px solid var(--line2);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tbody tr:first-child td{border-top:0}
.tk{font-family:var(--display);font-weight:700;font-size:15.5px}
.sub{display:block;color:var(--ink3);font-size:12px;font-family:var(--body)}
.pos{color:var(--good)} .neg{color:var(--bad)} .dim{color:var(--ink3)}
.rest{margin:0;padding:10px 12px;border-top:1px solid var(--line);color:var(--ink3);font-size:13px}

.foot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.foot{grid-template-columns:minmax(0,1fr)}}
.rules{margin:0;padding:6px 0;list-style:none}
.rules li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:5px 14px;font-size:14px}
.rules .n{font-family:var(--mono);color:var(--accent);font-weight:500}
.cal div{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:7px 14px;border-top:1px solid var(--line2);font-size:14px}
.cal div:first-child{border-top:0}
.cal .d{font-family:var(--mono);font-size:13px;color:var(--ink2)}
.note{color:var(--ink3);font-size:12.5px;margin:0}
</style>

<div class="wrap">
  <header class="head">
    <div><div class="eyebrow" id="eyebrow">Amana stock sleeve</div><h1>Amana Flag Board</h1></div>
    <div class="asof" id="asof"></div>
  </header>

  <section class="strip box" id="strip" aria-label="Account summary"></section>

  <section class="sec">
    <h2>Next</h2>
    <ol class="steps box" id="steps"></ol>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>Lines</h2><p>Stop −25% and take-profit +25% on every dip trade</p></div>
    <div class="tbl-wrap box"><table id="lines"></table></div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>Dip scan</h2><p id="scan-note"></p></div>
    <div class="box"><div class="tbl-wrap"><table id="scan"></table></div><p class="rest" id="rest"></p></div>
    <p class="note">Signal: the close is 15% or more below its 20-day high, and the stock is above a rising 200-day average.</p>
  </section>

  <div class="foot">
    <section class="sec"><h2>The rules</h2><ol class="rules box" id="rules"></ol></section>
    <section class="sec"><h2>Coming up</h2><div class="cal box" id="cal"></div></section>
  </div>

  <p class="note" id="foot"></p>
</div>

<script>
const D = /*DATA*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd = (v, d = 0) => (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const sgn = (v, d = 0) => (v >= 0 ? "+" : "−") + "$" + Math.abs(v).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (v, d = 1) => (v >= 0 ? "+" : "−") + Math.abs(v * 100).toFixed(d) + "%";
const md = s => s ? s.slice(5).replace("-", "/") : "";
const today = (D.asof || "").slice(0, 10);

$("eyebrow").textContent = "Amana stock sleeve · plan " + D.plan.split(" ")[0];
$("asof").innerHTML = `Prices <span class="num">${esc(D.asof)}</span>`;

const room = D.total - D.brake;
const cells = [
  ["Account", usd(D.total, 2), `${sgn(room)} above the ${usd(D.brake)} brake`,
   {fill: Math.max(0, Math.min(1, room / (D.peak - D.brake))), tone: room < 100 ? "bad" : room < 250 ? "warn" : ""}],
  ["VOO", (D.core_value / D.total * 100).toFixed(1) + "%", `target ${(D.core_target * 100).toFixed(0)}%, never sold`],
  ["Cash", usd(D.cash), `${D.fits} buys of ${usd(D.size)} fit · ${D.dips_open} of ${D.slots} slots used`],
  ["Dip trades", sgn(D.dip_closed), `closed so far · pause at ${usd(D.dip_brake)}`],
];
$("strip").innerHTML = cells.map(([k, v, s, m]) => `<div class="cell"><span class="k">${k}</span><span class="v">${v}</span>
  ${m ? `<span class="meter ${m.tone}"><i style="width:${(m.fill * 100).toFixed(0)}%"></i></span>` : ""}<span class="s">${s}</span></div>`).join("");

$("steps").innerHTML = D.steps.map((s, i) => `<li><span class="n">${i + 1}</span><span class="t">${esc(s.title)}</span>
  <span class="pill p-${esc(s.tone)}">${esc(s.when)}</span><span class="x">${esc(s.text)}</span></li>`).join("");

$("lines").innerHTML = `<thead><tr><th>Line</th><th>Price</th><th>P&amp;L</th><th>Stop</th><th>Take-profit</th><th>Report</th></tr></thead><tbody>` +
  D.lines.map(x => {
    const toSL = x.stop ? x.px / x.stop - 1 : null;
    return `<tr><td><span class="tk">${x.t}</span><span class="sub">${esc(x.kind)}</span></td>
      <td class="num">${x.px.toFixed(2)}<span class="sub">${usd(x.value)}</span></td>
      <td class="num ${x.pnl >= 0 ? "pos" : "neg"}">${sgn(x.pnl, 2)}<span class="sub">${pct(x.px / x.avg - 1)}</span></td>
      <td class="num">${x.stop ? x.stop.toFixed(2) + `<span class="sub ${toSL < 0.03 ? "neg" : ""}">${pct(toSL)} above</span>` : '<span class="dim">none</span>'}</td>
      <td class="num">${x.tp ? x.tp.toFixed(2) : '<span class="dim">none</span>'}</td>
      <td class="num">${x.report ? md(x.report) : '<span class="dim">—</span>'}</td></tr>`;
  }).join("") + `<tr><td><span class="tk">Cash</span></td><td class="num">${usd(D.cash, 2)}</td><td colspan="4"></td></tr></tbody>`;

const order = {signal: 0, blackout: 1, near: 2};
const shown = D.scan.filter(s => s.status in order).sort((a, b) => order[a.status] - order[b.status] || b.vs200 - a.vs200);
const ST = {signal: ["p-good", "Signal"], blackout: ["p-warn", "Earnings block"], near: ["p-watch", "Close to it"]};
$("scan-note").textContent = D.scan.some(s => s.live) ? "Provisional until today's close" : "On the last close";
$("scan").innerHTML = `<thead><tr><th>Stock</th><th>Price</th><th>Below 20-day high</th><th class="l">Status</th></tr></thead><tbody>` +
  shown.map(s => {
    const [cls, lab] = ST[s.status];
    const why = s.status === "blackout" ? `reports ${md(s.report)}` : s.before_buy_day ? `reports ${md(s.report)}, must survive it` : "";
    return `<tr><td><span class="tk">${s.t}</span><span class="sub">${esc(s.theme)}</span></td><td class="num">${s.px.toFixed(2)}</td>
      <td class="num">${pct(s.dd)}</td><td class="l"><span class="pill ${cls}">${lab}</span>${why ? `<span class="sub">${why}</span>` : ""}</td></tr>`;
  }).join("") + `</tbody>`;
const held = D.scan.filter(s => s.status === "held").map(s => s.t), none = D.scan.filter(s => s.status === "none").map(s => s.t);
$("rest").textContent = `No signal: ${none.join(", ")}.` + (held.length ? ` Held: ${held.join(", ")}.` : "");

$("rules").innerHTML = D.rules.map(([r], i) => `<li><span class="n">${i + 1}</span><span>${esc(r)}</span></li>`).join("");
$("cal").innerHTML = D.calendar.filter(c => c.d >= today).slice(0, 8)
  .map(c => `<div><span class="d">${md(c.d)}</span><span>${esc(c.what)}</span></div>`).join("");
$("foot").textContent = `Built from PLAN.md and the portfolio files, with Yahoo prices and Alpha Vantage earnings dates.`;
</script>
